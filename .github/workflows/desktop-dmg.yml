name: Desktop macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
      - run: pnpm install --frozen-lockfile
      - name: Build ad-hoc signed DMG
        run: bash tools/ci/build-macos-dmg.sh "$RUNNER_TEMP/dmg-${{ matrix.arch }}"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CodeFlowAI-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/dmg-${{ matrix.arch }}/*
          if-no-files-found: error
